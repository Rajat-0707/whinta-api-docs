                first_name:
                  type: string
                  description: First name for auto-created contact
                last_name:
                  type: string
                  description: Last name for auto-created contact
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              send_document:
                summary: Send a PDF invoice
                value:
                  phone: "+919876543210"
                  media_type: "document"
                  media_url: "https://cdn.example.com/invoice-1234.pdf"
                  file_name: "Invoice-1234.pdf"
