                statusCode: 400
                message: "The given data was invalid."
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contact-groups/{uuid}:
    put:
      tags: [AT-Contact Groups]
      operationId: atUpdateContactGroup
      summary: Update a contact group
      description: Updates the name of an existing contact group. The new name must be unique within the organization.
      security:
        - accessToken: []
      parameters:
