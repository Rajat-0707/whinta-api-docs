openapi: 3.0.3

info:
  title: Whinta API
  version: 1.0.7
  license:
    name: Proprietary
    url: https://whinta.com
  description: |
    The Whinta Public API lets you send WhatsApp messages, manage contacts,
    automate replies, browse templates, and register webhooks — all on behalf
    of a Whinta organization.

    Whinta exposes two authentication methods: **Access Token** (simple API key
    for server-to-server use) and **OAuth 2.0** (Authorization Code grant for
    third-party apps). See the **Authentication** section for setup details.

servers:
  - url: https://{host}
    description: Your Whinta installation
    variables:
      host:
        default: whinta.com
        description: Your Whinta domain

x-tagGroups:
  - name: Authentication
    tags:
      - Authentication Overview
      - Access Tokens
      - OAuth 2.0
      - Authorization Endpoint
      - Token Endpoint
      - Refresh Token
      - Scopes & Permissions
  - name: Access Token APIs
    tags:
      - AT-Introduction
      - AT-Messages
      - AT-Contacts
      - AT-Contact Groups
      - AT-Automated Replies
      - AT-Templates
  - name: OAuth 2.0 APIs
    tags:
      - OAuth APIs Introduction
      - Messages
      - Conversations
      - Contacts
      - Templates
      - Webhooks

tags:

  # ── Authentication ──────────────────────────────────────────────────────────

  - name: Authentication Overview
    description: |
      Whinta exposes two authentication methods. Choose the one that fits your use case:

      | Method | Best for | Base path | Header |
      |---|---|---|---|
      | **Access Token** | Server-to-server integrations, scripts, automations | `/api/...` | `Authorization: Bearer <token>` |
      | **OAuth 2.0** | Third-party apps acting on behalf of a user | `/api/v1/...` | `Authorization: Bearer <token>` (+ optional `X-Organization-UUID`) |

      Both methods use a standard `Authorization: Bearer` header. The difference is how
      the token is issued and what organization it grants access to.

      All API responses are JSON. Error responses include `statusCode` and `message`.
      Paginated responses include a `meta` object with `current_page`, `per_page`, `total`, and `last_page`.

      **Rate limit:** 60 requests per minute per token. Exceeding this returns `429 Too Many Requests`.

  - name: Access Tokens
    description: |
      Access Tokens are simple API keys tied to your organization.
      No OAuth flow required — generate one and start making requests.

      ### Generate an Access Token

      1. Log in to your Whinta dashboard.
      2. Go to **Developer Tools → Access Tokens**.
      3. Click **Generate API key** and copy the token.

      > Keep this token secret. It grants full API access to your organization.

      ### Using the token

      Pass the token in the `Authorization` header on every request:

      ```http
      Authorization: Bearer <your_access_token>
      ```

      No additional headers are required — the token is already bound to your organization.

      ### Example

      ```bash
      curl -X GET https://whinta.com/api/contacts \
        -H "Authorization: Bearer wat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      ```

  - name: OAuth 2.0
    description: |
      OAuth 2.0 lets third-party applications act on behalf of a Whinta user
      across one or more organizations, with scoped permissions.

      Whinta uses the **Authorization Code** grant (RFC 6749 §4.1).

      ### Quick overview

      1. **Register an OAuth application** in **Developer Tools → OAuth Clients**.
         Save your `client_id` and `client_secret`.

      2. **Redirect the user** to the authorization screen
         (see **Authorization Endpoint**).

      3. **Exchange the authorization code** for an access token
         (see **Token Endpoint**).

      4. **Call the API** with the access token:
         ```http
         Authorization: Bearer <access_token>
         ```
         If your token was not bound to a specific organization during consent, also pass:
         ```http
         X-Organization-UUID: <org_uuid>
         ```

      Access tokens expire after a set period. Use the **Refresh Token** endpoint
      to obtain a new one without re-authorizing.

  - name: Authorization Endpoint
    description: |
      Redirects the user to Whinta's authorization screen where they grant
      (or deny) your application access to their organization.

  - name: Token Endpoint
    description: |
      Exchanges an authorization code for an access token and refresh token.

  - name: Refresh Token
    description: |
      Access tokens expire. Use the refresh token to obtain a new access token
      without requiring the user to re-authorize.

      **Endpoint:** `POST /oauth/token`

      ```bash
      curl -X POST https://whinta.com/oauth/token \
        -H "Content-Type: application/json" \
        -d '{
          "grant_type": "refresh_token",
          "refresh_token": "<your_refresh_token>",
          "client_id": "<your_client_id>",
          "client_secret": "<your_client_secret>",
          "scope": "chat:read contacts:read"
        }'
      ```

      **Response:**
      ```json
      {
        "token_type": "Bearer",
        "expires_in": 31536000,
        "access_token": "<new_access_token>",
        "refresh_token": "<new_refresh_token>"
      }
      ```

      > Each refresh issues a **new refresh token** and invalidates the old one.
      > Store the new `refresh_token` from every response.

  - name: Scopes & Permissions
    description: |
      Scopes limit what an OAuth 2.0 access token can do.
      Request only the scopes your application actually needs.

      | Scope | Permission |
      |---|---|
      | `chat:read` | Read conversations and message history |
      | `chat:write` | Send messages on behalf of the organization |
      | `contacts:read` | Read contacts |
      | `contacts:write` | Create, update, and delete contacts |
      | `templates:read` | View approved WhatsApp message templates |
      | `webhooks:read` | View registered webhook endpoints |
      | `webhooks:write` | Register and delete webhook endpoints |

      > `webhooks:read` and `webhooks:write` require the **Webhooks addon**
      > to be enabled on the organization's plan.

      ### Requesting scopes

      Include scopes (space-separated) in the authorization URL:

      ```
      GET /oauth/authorize
        ?client_id=<client_id>
        &redirect_uri=<redirect_uri>
        &response_type=code
        &scope=chat:read contacts:read templates:read
        &state=<random_string>
      ```

  # ── Access Token API tags ───────────────────────────────────────────────────

  - name: AT-Introduction
    x-displayName: Introduction
    description: |
      The Access Token API provides a simple way to integrate Whinta into your
      server-side applications, scripts, and automations without any OAuth flow.

      ### Base URL

      ```
      https://whinta.com/api/
      ```

      ### Authentication

      Every request must include your Access Token in the `Authorization` header:

      ```http
      Authorization: Bearer <your_access_token>
      ```

      Generate a token from **Developer Tools → Access Tokens → Generate API key**
      in your Whinta dashboard. The token is automatically scoped to your organization —
      no extra headers required.

      ### What's available

      | Resource | Endpoints |
      |---|---|
      | **Messages** | Send text, template, and media messages |
      | **Contacts** | Full CRUD |
      | **Contact Groups** | Full CRUD |
      | **Automated Replies** | Full CRUD |
      | **Templates** | List approved templates |

      ### Response format

      All responses are JSON. Mutation responses return:
      ```json
      { "statusCode": 200, "id": "<uuid>", "message": "Request processed successfully" }
      ```
      List responses return paginated data:
      ```json
      { "data": [...], "meta": { "current_page": 1, "per_page": 10, "total": 42, "last_page": 5 } }
      ```

  - name: AT-Messages
    x-displayName: Messages
    description: |
      Send WhatsApp messages to any phone number using your Access Token.

      Supports plain text (with optional interactive buttons), pre-approved templates,
      and media attachments (image, video, audio, document).

      If the recipient phone number is not yet in your contacts, a contact record
      is created automatically.
  - name: AT-Contacts
    x-displayName: Contacts
    description: Create, read, update, and delete contacts in your organization.
  - name: AT-Contact Groups
    x-displayName: Contact Groups
    description: |
      Organize contacts into named groups for segmentation and bulk messaging.

      Group names must be unique within the organization.
  - name: AT-Automated Replies
    x-displayName: Automated Replies
    description: |
      Configure keyword-triggered auto-reply rules.

      When an inbound message matches the `trigger` keyword (based on `match_criteria`),
      Whinta automatically sends the configured response — text, image, or audio.
  - name: AT-Templates
    x-displayName: Templates
    description: |
      Browse your organization's approved WhatsApp message templates.

      Use the `metadata` field to inspect component structure (variables, header
      media, buttons) before calling the send-template endpoint.

  # ── OAuth 2.0 API tags ──────────────────────────────────────────────────────

  - name: OAuth APIs Introduction
    x-displayName: Introduction
    description: |
      The OAuth 2.0 API lets third-party applications send messages, read conversations,
      and manage contacts on behalf of a Whinta user — with their explicit consent and
      with scoped permissions they can revoke at any time.

      ### Base URL

      ```
      https://whinta.com/api/v1/
      ```

      ### Authentication

      Every request requires:

      ```http
      Authorization: Bearer <oauth_access_token>
      ```

      The `X-Organization-UUID` header is **optional**. At OAuth consent time the token is
      bound to the organization the user authorized — so the org is resolved automatically
      from the token. You only need this header if your token is not org-bound and you want
      to target a specific organization. If omitted entirely, it falls back to the user's
      first organization.

      ```http
      X-Organization-UUID: <organization_uuid>   # optional
      ```

      > Passing a UUID that doesn't match the token's bound org returns `403 Forbidden`.

      ### Scopes

      Each endpoint requires one or more OAuth scopes. Scopes are requested during the
      authorization flow — see **Scopes & Permissions** for the full list.

      ### What's available

      | Resource | Scopes required |
      |---|---|
      | **Messages** | `chat:write` (send), `chat:read` (read) |
      | **Conversations** | `chat:read` |
      | **Contacts** | `contacts:read` / `contacts:write` |
      | **Templates** | `templates:read` |
      | **Webhooks** | `webhooks:read` / `webhooks:write` _(addon required)_ |

      ### Response format

      All responses are JSON. Successful responses wrap data in a `data` key.
      Error responses include `statusCode` and a human-readable `message`.
      Paginated responses include a `meta` object with `current_page`, `per_page`, `total`, and `last_page`.

  - name: Messages
    description: |
      Send WhatsApp messages on behalf of a user's organization using an OAuth 2.0 token.

      Supports plain text (with optional interactive buttons), pre-approved templates,
      and media attachments (image, video, audio, document).

      **Required scopes:** `chat:write` for sending; `chat:read` for reading.
  - name: Conversations
    description: |
      Read conversation history and manage read state for a user's organization.

      A "conversation" in Whinta is the full message thread with a single contact.

      **Required scope:** `chat:read`
  - name: Contacts
    description: |
      Create, read, update, and delete contacts in a user's organization.

      **Required scopes:** `contacts:read` for listing/viewing; `contacts:write` for mutations.
  - name: Templates
    description: |
      Browse the approved WhatsApp message templates for a user's organization.

      **Required scope:** `templates:read`
  - name: Webhooks
    description: |
      Register HTTPS callback URLs to receive real-time message events.

      **Requires the Webhooks addon** to be enabled on the organization's plan.

      **Events delivered:**
      - `message.received` — inbound message arrived from a contact
      - `message.sent` — outbound message was dispatched
      - `message.status.update` — delivery status changed (sent → delivered → read / failed)

      **Required scopes:** `webhooks:read` for listing; `webhooks:write` for registering/deleting.

# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: |
        **Access Token** — generated from Developer Tools → Access Tokens → Generate API key.
        The token is scoped to your organization automatically.
        Pass as `Authorization: Bearer <token>`.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        **OAuth2 Bearer token** — obtained via the Authorization Code grant.
        Pass as `Authorization: Bearer <token>`. The org is resolved automatically
        from the token binding set at consent time. `X-Organization-UUID` is only
        needed for unbound tokens targeting a non-default organization.

  parameters:
    XOrgUUID:
      name: X-Organization-UUID
      in: header
      required: false
      schema:
        type: string
        format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      description: |
        UUID of the target organization. Optional — the token's org binding (set
        at consent time) is used automatically. Only needed for unbound tokens
        targeting a specific non-default organization. Passing a UUID that doesn't
        match the token's bound org returns `403 Forbidden`.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of results per page (max 100)

  responses:
    SubscriptionError:
      description: Subscription inactive or plan limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            inactive:
              summary: Subscription inactive
              value:
                statusCode: 403
                message: "Please renew or subscribe to a plan to continue!"
            limit_reached:
              summary: Contact limit reached
              value:
                statusCode: 403
                message: "You have reached your limit of contacts. Please upgrade your account to add more!"
    WhatsAppApiError:
      description: WhatsApp Cloud API rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 502
            message: "Message failed to send: (#131026) The recipient phone number is not a WhatsApp user."
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: "Not found."
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            message: "The phone field is required."
            errors:
              phone:
                - "The phone field is required."
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
          examples:
            missing_token:
              summary: No token provided
              value:
                error: "Unauthorized. Bearer Token is missing."
            invalid_token:
              summary: Token not found or revoked
              value:
                error: "Unauthorized. Invalid Bearer Token."

  schemas:

    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 143
        last_page:
          type: integer
          example: 8
        from:
          type: integer
          nullable: true
          description: 1-based index of the first item on this page
          example: 1
        to:
          type: integer
          nullable: true
          description: 1-based index of the last item on this page
          example: 20
        path:
          type: string
          description: Base URL of the resource (without page query params)
          example: "https://app.whinta.com/api/contacts"

    PaginationLinks:
      type: object
      description: Pagination navigation links included in every list response
      properties:
        first:
          type: string
          nullable: true
          description: URL of the first page
          example: "https://app.whinta.com/api/contacts?page=1"
        last:
          type: string
          nullable: true
          description: URL of the last page
          example: "https://app.whinta.com/api/contacts?page=8"
        prev:
          type: string
          nullable: true
          description: URL of the previous page, or null on the first page
          example: null
        next:
          type: string
          nullable: true
          description: URL of the next page, or null on the last page
          example: "https://app.whinta.com/api/contacts?page=2"

    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 403
        message:
          type: string
          example: "Unauthorized."

    # ── Contact ───────────────────────────────────────────────────────────────

    Contact:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        first_name:
          type: string
          example: "Priya"
        last_name:
          type: string
          nullable: true
          example: "Sharma"
        full_name:
          type: string
          description: Computed first_name + last_name
          example: "Priya Sharma"
        phone:
          type: string
          description: E.164 formatted phone number
          example: "+919876543210"
        formatted_phone_number:
          type: string
          description: Internationally formatted phone number
          example: "+91 98765 43210"
        email:
          type: string
          format: email
          nullable: true
          example: "priya@example.com"
        avatar:
          type: string
          nullable: true
          description: URL of the contact's profile picture, or null if not set
          example: "https://cdn.example.com/avatars/priya.jpg"
        subscription_status:
          type: string
          nullable: true
          enum: [subscribed, unsubscribed]
          description: WhatsApp marketing subscription status
          example: "subscribed"
        is_favorite:
          type: boolean
          description: Whether the contact is marked as a favourite
          example: false
        unread_messages:
          type: integer
          description: Number of unread inbound messages from this contact
          example: 2
        groups:
          type: array
          description: Names of the contact groups this contact belongs to
          items:
            type: string
          example: ["VIP Customers", "Newsletter"]
        label:
          nullable: true
          description: Label assigned to this contact, or null
          type: object
          properties:
            id:
              type: integer
              example: 3
            uuid:
              type: string
              format: uuid
              example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
            name:
              type: string
              example: "Hot Lead"
            color:
              type: string
              description: Hex color code for the label
              example: "#FF5733"
        created_at:
          type: string
          description: Creation time in the organization's configured timezone
          example: "2024-06-01 10:30:00"
        updated_at:
          type: string
          description: Last update time in the organization's configured timezone
          example: "2024-06-01 10:30:00"

    # ── Conversation ──────────────────────────────────────────────────────────

    Conversation:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        name:
          type: string
          description: Contact's full name
          example: "Priya Sharma"
        phone:
          type: string
          example: "+919876543210"
        email:
          type: string
          nullable: true
          example: "priya@example.com"
        last_message:
          type: string
          nullable: true
          description: |
            Human-readable preview of the last message. Examples:
            - Plain text: `"Hi, I need help with my order."`
            - Template: `"📋 order_confirmation"`
            - Image: `"📷 Image"`
            - Document: `"📎 Invoice-1234.pdf"`
          example: "Hi, I need help with my order."
        last_message_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-06-05T14:22:00.000Z"
        unread_count:
          type: integer
          description: Number of unread inbound messages from this contact
          example: 3

    # ── Template ──────────────────────────────────────────────────────────────

    Template:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "4fa85f64-5717-4562-b3fc-2c963f66afa7"
        metadata:
          type: object
          description: |
            Full template definition as returned by the Meta API. Contains:
            - `name` — template identifier
            - `language` — BCP-47 language code
            - `category` — `MARKETING`, `UTILITY`, or `AUTHENTICATION`
            - `components` — array of HEADER, BODY, FOOTER, and BUTTONS components
          example:
            name: "order_confirmation"
            language: "en"
            category: "UTILITY"
            components:
              - type: "BODY"
                text: "Hi {{1}}, your order {{2}} has been confirmed."
        updated_at:
          type: string
          format: date-time
          example: "2024-05-20T08:00:00.000Z"

    # ── Contact Group ─────────────────────────────────────────────────────────

    ContactGroup:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "5fa85f64-5717-4562-b3fc-2c963f66afa8"
        name:
          type: string
          description: Group name — unique within the organization
          example: "VIP Customers"
        created_at:
          type: string
          format: date-time
          example: "2024-06-01T10:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-06-01T10:00:00.000Z"

    # ── Automated Reply ───────────────────────────────────────────────────────

    AutomatedReply:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "7fa85f64-5717-4562-b3fc-2c963f66afaa"
        name:
          type: string
          description: Internal label for this rule
          example: "Greeting reply"
        trigger:
          type: string
          description: Keyword that triggers this reply
          example: "hello"
        match_criteria:
          type: string
          enum: [exact match, contains]
          description: |
            - `exact match` — inbound message must be exactly the trigger word
            - `contains` — inbound message just needs to contain the trigger word
          example: "contains"
        metadata:
          type: object
          description: Response definition
          properties:
            type:
              type: string
              enum: [text, image, audio]
              example: "text"
            data:
              type: object
              properties:
                text:
                  type: string
                  description: Present when type is `text`
                  example: "Hi! How can I help you?"
                file:
                  type: object
                  description: Present when type is `image` or `audio`
                  properties:
                    name:
                      type: string
                    location:
                      type: string
        updated_at:
          type: string
          format: date-time
          example: "2024-06-01T10:00:00.000Z"

    # ── Standard operation response ───────────────────────────────────────────

    OperationResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        id:
          type: string
          format: uuid
          description: UUID of the created / updated / deleted resource
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        message:
          type: string
          example: "Request processed successfully"

    # ── Webhook ───────────────────────────────────────────────────────────────

    Webhook:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "8fa85f64-5717-4562-b3fc-2c963f66afab"
        url:
          type: string
          format: uri
          example: "https://myapp.example.com/webhooks/whinta"
        events:
          type: array
          items:
            type: string
            enum:
              - message.received
              - message.sent
              - message.status.update
          example: ["message.received", "message.status.update"]
        created_at:
          type: string
          format: date-time
          example: "2024-06-01T09:00:00.000Z"

# ─────────────────────────────────────────────────────────────────────────────
# Default security
# ─────────────────────────────────────────────────────────────────────────────

security:
  - bearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Paths — Public API v1
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ── OAuth 2.0 Auth Endpoints ──────────────────────────────────────────────────

  /oauth/authorize:
    get:
      tags: [Authorization Endpoint]
      operationId: oauthAuthorize
      summary: Authorization endpoint
      description: |
        Redirects the user's browser to Whinta's authorization screen.
        The user is prompted to grant (or deny) the requested scopes to your application.

        On approval, Whinta redirects to your `redirect_uri` with a one-time `code`
        and your original `state` value as query parameters:

        ```
        https://yourapp.example.com/callback?code=<auth_code>&state=<your_state>
        ```

        Pass `code` to the **Token Endpoint** to exchange it for an access token.

        > This endpoint is a browser redirect — do **not** call it with server-side HTTP.
        > Open it in a browser or a WebView.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Your OAuth application's client ID
          example: "9c1a2b3d-0000-0000-0000-000000000001"
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: The callback URL registered with your OAuth client
          example: "https://yourapp.example.com/callback"
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Must be `code` for the Authorization Code grant
          example: "code"
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of scopes to request
          example: "chat:read contacts:read templates:read"
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: |
            A random, unguessable string your app generates. Whinta echoes it back
            in the redirect. Verify it matches to prevent CSRF attacks.
          example: "x7k2m9p1q4"
      responses:
        '302':
          description: |
            Redirect to your `redirect_uri` with `code` and `state` on success,
            or with `error` and `error_description` on denial/failure.
        '401':
          description: Invalid or unknown `client_id`

  /oauth/token:
    post:
      tags: [Token Endpoint]
      operationId: oauthToken
      summary: Token endpoint
      description: |
        Exchanges an authorization code for an access token and refresh token.

        Set `Content-Type: application/json` and pass the body fields shown below.
        The `client_secret` must match the secret generated when you created the OAuth client.

        The returned `access_token` is valid for **15 days** by default.
        The `refresh_token` is valid for **30 days**.
        Use the **Refresh Token** flow to get a new token after expiry without
        re-authorizing the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id, client_secret, redirect_uri, code]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                  description: Must be `authorization_code`
                  example: "authorization_code"
                client_id:
                  type: string
                  description: Your OAuth application's client ID
                  example: "9c1a2b3d-0000-0000-0000-000000000001"
                client_secret:
                  type: string
                  description: Your OAuth application's client secret
                  example: "your_client_secret"
                redirect_uri:
                  type: string
                  format: uri
                  description: The same redirect URI used in the authorization request
                  example: "https://yourapp.example.com/callback"
                code:
                  type: string
                  description: The authorization code received at your redirect URI
                  example: "def502009a3b..."
            example:
              grant_type: "authorization_code"
              client_id: "9c1a2b3d-0000-0000-0000-000000000001"
              client_secret: "your_client_secret"
              redirect_uri: "https://yourapp.example.com/callback"
              code: "def502009a3b..."
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type:
                    type: string
                    example: "Bearer"
                  expires_in:
                    type: integer
                    description: Seconds until the access token expires (15 days)
                    example: 1296000
                  access_token:
                    type: string
                    description: Bearer token to use in `Authorization` header
                  refresh_token:
                    type: string
                    description: Token used to obtain a new access token after expiry
              example:
                token_type: "Bearer"
                expires_in: 1296000
                access_token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
                refresh_token: "def502004a9b..."
        '400':
          description: Invalid grant — code expired, already used, or mismatched redirect URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "invalid_request"
                  error_description:
                    type: string
                    example: "The authorization code has expired."
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "invalid_client"

  # ── Messages ─────────────────────────────────────────────────────────────────

  /api/v1/messages/send:
    post:
      tags: [Messages]
      operationId: sendTextMessage
      summary: Send a text message
      description: |
        Send a plain text WhatsApp message to a contact.

        If `buttons` are included the message is upgraded to an **interactive buttons**
        message automatically.

        The contact is **auto-created** if no matching phone number exists for the
        organization — pass `first_name` / `last_name` / `email` to populate the new record.
      security:
        - bearerAuth: [chat:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, message]
              properties:
                phone:
                  type: string
                  description: Recipient phone number — with or without leading `+`. Normalized to E.164 internally.
                  example: "+919876543210"
                message:
                  type: string
                  maxLength: 4096
                  description: Message body text
                  example: "Hello! Your order has been shipped and will arrive in 2 days."
                header:
                  type: string
                  description: Header text — only used for interactive button messages
                  example: "Order Update"
                footer:
                  type: string
                  description: Footer text — only used for interactive button messages
                  example: "Reply anytime"
                buttons:
                  type: array
                  description: |
                    Quick-reply or URL buttons. Providing this field upgrades the message
                    to an interactive type. Follow the WhatsApp interactive object format.
                  items:
                    type: object
                first_name:
                  type: string
                  maxLength: 128
                  description: First name for auto-created contact
                last_name:
                  type: string
                  maxLength: 128
                  description: Last name for auto-created contact
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              plain_text:
                summary: Plain text message
                value:
                  phone: "+919876543210"
                  message: "Hi! Your order #1234 has been shipped and will arrive in 2 days."
              interactive_buttons:
                summary: Interactive buttons message
                value:
                  phone: "+919876543210"
                  message: "Would you like to confirm your appointment for tomorrow at 3 PM?"
                  header: "Appointment Reminder"
                  footer: "Tap a button to respond"
                  buttons:
                    - type: reply
                      reply:
                        id: confirm
                        title: "✅ Confirm"
                    - type: reply
                      reply:
                        id: cancel
                        title: "❌ Cancel"
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    description: Raw success response from WhatsApp Cloud API
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/WhatsAppApiError'

  /api/v1/messages/send/template:
    post:
      tags: [Messages]
      operationId: sendTemplateMessage
      summary: Send a template message
      description: |
        Send a pre-approved WhatsApp message template to a contact.

        The template must exist in the organization's approved templates
        (browse them with `GET /api/v1/templates`).

        ---

        ### Body variables

        If the template body contains `{{1}}`, `{{2}}`, etc., pass values **in order**
        in `template.body_params`. The array length must exactly match the variable count
        — a mismatch returns 422.

        ### Header media

        Templates with an **IMAGE**, **VIDEO**, or **DOCUMENT** header require
        `template.header_media.url`. Passing it when not needed returns 422.
        For DOCUMENT headers also pass `template.header_media.filename`.

        ### Dynamic URL buttons

        Buttons whose URL contains `{{1}}` require a suffix value in
        `template.button_params`. Provide the 0-based button `index` and the
        URL `value` to append. All dynamic URL buttons must be covered.
      security:
        - bearerAuth: [chat:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, template]
              properties:
                phone:
                  type: string
                  description: Recipient phone number — with or without leading `+`
                  example: "+919876543210"
                template:
                  type: object
                  required: [name, language]
                  properties:
                    name:
                      type: string
                      description: Template name as registered in Meta Business Manager
                      example: "order_confirmation"
                    language:
                      type: string
                      description: BCP-47 language code (e.g. `en`, `en_US`, `hi`)
                      example: "en"
                    body_params:
                      type: array
                      description: |
                        Ordered values for `{{1}}`, `{{2}}`, … placeholders in the template body.
                        Must match the exact variable count of the template.
                      items:
                        type: string
                      example: ["John Doe", "ORD-12345", "₹499"]
                    header_media:
                      type: object
                      description: Required for IMAGE / VIDEO / DOCUMENT header templates
                      required: [url]
                      properties:
                        url:
                          type: string
                          format: uri
                          maxLength: 2048
                          description: Publicly accessible media URL (no private/localhost URLs)
                          example: "https://cdn.example.com/banner.jpg"
                        filename:
                          type: string
                          maxLength: 255
                          description: Display filename — required for DOCUMENT headers
                          example: "Invoice-1234.pdf"
                    button_params:
                      type: array
                      description: URL suffix values for dynamic URL buttons (those whose URL contains `{{1}}`)
                      items:
                        type: object
                        required: [index, value]
                        properties:
                          index:
                            type: integer
                            minimum: 0
                            description: 0-based position of the button in the template's buttons array
                            example: 0
                          value:
                            type: string
                            maxLength: 2048
                            description: URL suffix appended to the button's static base URL
                            example: "ORD-12345"
                first_name:
                  type: string
                  maxLength: 128
                  description: First name for auto-created contact
                last_name:
                  type: string
                  maxLength: 128
                  description: Last name for auto-created contact
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              simple_body_vars:
                summary: Template with body variables
                value:
                  phone: "+919876543210"
                  template:
                    name: "order_confirmation"
                    language: "en"
                    body_params: ["John Doe", "ORD-12345", "₹499"]
              image_header:
                summary: Template with image header
                value:
                  phone: "+919876543210"
                  template:
                    name: "product_launch"
                    language: "en"
                    header_media:
                      url: "https://cdn.example.com/product.jpg"
                    body_params: ["Summer Sale 2024"]
              dynamic_url_button:
                summary: Template with dynamic URL button
                value:
                  phone: "+919876543210"
                  template:
                    name: "track_order"
                    language: "en"
                    body_params: ["ORD-12345"]
                    button_params:
                      - index: 0
                        value: "ORD-12345"
              document_header:
                summary: Template with document header
                value:
                  phone: "+919876543210"
                  template:
                    name: "invoice_ready"
                    language: "en"
                    header_media:
                      url: "https://cdn.example.com/invoice-1234.pdf"
                      filename: "Invoice-1234.pdf"
      responses:
        '200':
          description: Template message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    description: Raw success response from WhatsApp Cloud API
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '422':
          description: |
            Template validation failed. Common causes:
            - Template name not found in this organization
            - Wrong number of `body_params` for the template's variable count
            - `header_media` missing when template has a media header (or provided when not needed)
            - `button_params` missing or incorrect for dynamic URL buttons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                template_not_found:
                  summary: Template not found
                  value:
                    statusCode: 422
                    message: "Template 'order_confirmation' not found in your organization."
                wrong_body_params:
                  summary: Wrong variable count
                  value:
                    statusCode: 422
                    message: "Template 'order_confirmation' expects 3 body variable(s), got 2."
                missing_header_media:
                  summary: Missing media URL
                  value:
                    statusCode: 422
                    message: "Template 'product_launch' has a IMAGE header. Provide a publicly accessible media URL in template.header_media.url."
        '502':
          $ref: '#/components/responses/WhatsAppApiError'

  /api/v1/messages/send/media:
    post:
      tags: [Messages]
      operationId: sendMediaMessage
      summary: Send a media message
      description: |
        Send an image, video, audio, or document message to a contact.

        The `media_url` must be a publicly accessible HTTPS URL. Private network
        addresses (localhost, 192.168.x.x, 10.x.x.x, etc.) are rejected.
      security:
        - bearerAuth: [chat:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, media_type, media_url, file_name]
              properties:
                phone:
                  type: string
                  description: Recipient phone number — with or without leading `+`
                  example: "+919876543210"
                media_type:
                  type: string
                  enum: [image, video, audio, document]
                  description: Type of media to send
                media_url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Publicly accessible URL of the media file
                  example: "https://cdn.example.com/invoice-1234.pdf"
                file_name:
                  type: string
                  maxLength: 255
                  description: Display filename shown in chat (important for documents)
                  example: "Invoice-1234.pdf"
                caption:
                  type: string
                  description: Optional caption displayed below the media
                  example: "Please find your invoice attached."
                first_name:
                  type: string
                  maxLength: 128
                  description: First name for auto-created contact
                last_name:
                  type: string
                  maxLength: 128
                  description: Last name for auto-created contact
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              send_document:
                summary: Send a PDF document
                value:
                  phone: "+919876543210"
                  media_type: "document"
                  media_url: "https://cdn.example.com/invoice-1234.pdf"
                  file_name: "Invoice-1234.pdf"
                  caption: "Your invoice for order #1234."
              send_image:
                summary: Send an image
                value:
                  phone: "+919876543210"
                  media_type: "image"
                  media_url: "https://cdn.example.com/product-banner.jpg"
                  file_name: "product-banner.jpg"
                  caption: "Check out our new collection!"
      responses:
        '200':
          description: Media message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    description: Raw success response from WhatsApp Cloud API
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/WhatsAppApiError'

  # ── Conversations ─────────────────────────────────────────────────────────────

  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      description: |
        Returns all contacts that have at least one chat message, ordered by most
        recent activity. Each item includes the latest message preview and unread
        inbound message count.
      security:
        - bearerAuth: [chat:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Results per page (max 100)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        '200':
          description: Paginated conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - uuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    name: "Priya Sharma"
                    phone: "+919876543210"
                    email: "priya@example.com"
                    last_message: "Thanks, I got my order!"
                    last_message_at: "2024-06-05T14:22:00.000Z"
                    unread_count: 0
                  - uuid: "c1d2e3f4-0000-0000-0000-000000000002"
                    name: "Rahul Verma"
                    phone: "+919812345678"
                    email: null
                    last_message: "📋 order_confirmation"
                    last_message_at: "2024-06-05T13:10:00.000Z"
                    unread_count: 2
                meta:
                  current_page: 1
                  per_page: 20
                  total: 87
                  last_page: 5

  /api/v1/conversations/{id}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation
      description: Returns a single conversation — contact details, latest message preview, and unread count.
      security:
        - bearerAuth: [chat:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Conversation'
              example:
                data:
                  uuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  name: "Priya Sharma"
                  phone: "+919876543210"
                  email: "priya@example.com"
                  last_message: "Thanks, I got my order!"
                  last_message_at: "2024-06-05T14:22:00.000Z"
                  unread_count: 0
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{id}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: List messages in a conversation
      description: |
        Returns paginated message history for a contact in **chronological order**
        (oldest first within each page).

        Default `per_page` is 20, maximum is 50. Use `page` to navigate back through
        older messages.
      security:
        - bearerAuth: [chat:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Results per page (max 50)
      responses:
        '200':
          description: Paginated message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 4821
                        type:
                          type: string
                          description: Entity type (always `"chat"` currently)
                          example: "chat"
                        created_at:
                          type: string
                          format: date-time
                          example: "2024-06-05T14:22:00.000Z"
                        entity:
                          type: object
                          nullable: true
                          description: Hydrated chat object with media, user, and delivery log relations
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PaginationMeta'
                      - type: object
                        properties:
                          has_more:
                            type: boolean
                            description: Whether more pages exist after this one
                            example: true
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/conversations/{id}/mark-read:
    post:
      tags: [Conversations]
      operationId: markConversationRead
      summary: Mark conversation as read
      description: Marks all unread **inbound** messages in this conversation as read. Has no effect if there are no unread messages.
      security:
        - bearerAuth: [chat:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID
      responses:
        '200':
          description: Messages marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Messages marked as read."
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Contacts ──────────────────────────────────────────────────────────────────

  /api/v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts
      description: |
        Returns a paginated list of contacts for the organization, ordered by most
        recently created.

        Use `search` to filter across `first_name`, `last_name`, `phone`, and `email`
        (case-insensitive).
      security:
        - bearerAuth: [contacts:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Search term — matches first name, last name, phone, or email
          example: "priya"
      responses:
        '200':
          description: Paginated contact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - uuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    first_name: "Priya"
                    last_name: "Sharma"
                    name: "Priya Sharma"
                    phone: "+919876543210"
                    email: "priya@example.com"
                    created_at: "2024-06-01T10:30:00.000Z"
                    updated_at: "2024-06-01T10:30:00.000Z"
                meta:
                  current_page: 1
                  per_page: 20
                  total: 143
                  last_page: 8

    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create a contact
      description: |
        Creates a new contact. The phone number is normalized to E.164 and must be
        unique within the organization — duplicate phone numbers return a 422.

        Returns 403 if the subscription is inactive or the plan's contact limit is reached.
      security:
        - bearerAuth: [contacts:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, phone]
              properties:
                first_name:
                  type: string
                  maxLength: 128
                  example: "Priya"
                last_name:
                  type: string
                  maxLength: 128
                  example: "Sharma"
                phone:
                  type: string
                  description: Phone number with or without leading `+`. Stored as E.164.
                  example: "+919876543210"
                email:
                  type: string
                  format: email
                  nullable: true
                  example: "priya@example.com"
            example:
              first_name: "Priya"
              last_name: "Sharma"
              phone: "+919876543210"
              email: "priya@example.com"
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Contact created."
                  data:
                    $ref: '#/components/schemas/Contact'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '422':
          description: Phone number already exists for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 422
                message: "A contact with this phone number already exists."

  /api/v1/contacts/{uuid}:
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact
      security:
        - bearerAuth: [contacts:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contact'
              example:
                data:
                  uuid: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  first_name: "Priya"
                  last_name: "Sharma"
                  name: "Priya Sharma"
                  phone: "+919876543210"
                  email: "priya@example.com"
                  created_at: "2024-06-01T10:30:00.000Z"
                  updated_at: "2024-06-01T10:30:00.000Z"
        '404':
