              send_image:
                summary: Send an image
                value:
                  phone: "+919876543210"
                  media_type: "image"
                  media_url: "https://cdn.example.com/banner.jpg"
                  file_name: "banner.jpg"
                  caption: "Check out our latest offers!"
      responses:
        '200':
          description: Media message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

