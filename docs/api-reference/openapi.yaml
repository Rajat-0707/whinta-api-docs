                  description: Phone number. Normalized to E.164.
                  example: "+919876543210"
                email:
                  type: string
                  format: email
                  example: "priya@example.com"
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [AT-Contacts]
      operationId: atDeleteContact
      summary: Delete a contact
      description: Soft-deletes the contact. Message history is retained.
      security:
        - accessToken: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Contact UUID
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                statusCode: 200
                id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                message: "Request processed successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── AT: Contact Groups ────────────────────────────────────────────────────────

  /api/contact-groups:
