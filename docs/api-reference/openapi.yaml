  # ── Templates ─────────────────────────────────────────────────────────────────

  /api/v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List templates
      description: |
        Returns all approved WhatsApp message templates for the organization.

        Use the `metadata.components` array to discover:
        - **Variable count** — count `{{N}}` patterns in the BODY component text
        - **Header type** — check `components[].format` on the HEADER component
          (`TEXT`, `IMAGE`, `VIDEO`, `DOCUMENT`)
        - **Button type** — check `components[].buttons[].type`
          (`QUICK_REPLY`, `URL`, `PHONE_NUMBER`)

        This is useful for building the correct `template.body_params` and
        `template.button_params` before calling `POST /api/v1/messages/send/template`.
      security:
        - bearerAuth: [templates:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Results per page (max 100)
      responses:
        '200':
          description: Paginated template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - uuid: "4fa85f64-5717-4562-b3fc-2c963f66afa7"
                    metadata:
                      name: "order_confirmation"
                      language: "en"
                      category: "UTILITY"
                      components:
                        - type: "HEADER"
                          format: "TEXT"
                          text: "Order Confirmed"
                        - type: "BODY"
                          text: "Hi {{1}}, your order {{2}} for ₹{{3}} has been confirmed."
                        - type: "FOOTER"
                          text: "Thank you for shopping with us!"
                    updated_at: "2024-05-20T08:00:00.000Z"
                meta:
                  current_page: 1
                  per_page: 20
                  total: 12
                  last_page: 1

  # ── Webhooks ──────────────────────────────────────────────────────────────────

  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhooks
      description: |
        List webhook URLs registered for the organization that are subscribed to
        chat events.

        > **Requires the Webhooks addon** to be enabled on the organization's plan.
        > Returns 403 if the addon is not active.
      security:
        - bearerAuth: [webhooks:read]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      responses:
        '200':
          description: List of registered webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
              example:
                data:
                  - uuid: "8fa85f64-5717-4562-b3fc-2c963f66afab"
                    url: "https://myapp.example.com/webhooks/whinta"
                    events:
                      - message.received
                      - message.status.update
                    created_at: "2024-06-01T09:00:00.000Z"
        '403':
          description: Webhooks addon not enabled on the organization's plan

    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Register a webhook
      description: |
        Register an HTTPS callback URL to receive real-time chat events.

        Whinta sends a `POST` request to the URL each time a subscribed event fires.
        If `events` is omitted, all three chat events are subscribed by default.

        Maximum **25 webhooks** per organization.

        > **Requires the Webhooks addon** to be enabled on the organization's plan.

        ---

        ### Webhook payload

        ```json
        {
          "event": "message.received",
          "organization_uuid": "a1b2c3d4-...",
          "data": { ... }
        }
        ```

        | Event | Fired when |
        |---|---|
        | `message.received` | An inbound message arrives from a contact |
        | `message.sent` | An outbound message is sent to a contact |
        | `message.status.update` | Delivery status changes (sent → delivered → read / failed) |

        ### Responding to deliveries

        Your endpoint must return a `2xx` status within **10 seconds**. Failed deliveries
        are not automatically retried — ensure your endpoint is reliable.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 500
                  description: |
                    Publicly accessible HTTPS endpoint. Private/localhost URLs are rejected.
                  example: "https://myapp.example.com/webhooks/whinta"
                events:
                  type: array
                  description: |
                    Events to subscribe to. Defaults to all three chat events if omitted.
                  items:
                    type: string
                    enum:
                      - message.received
                      - message.sent
                      - message.status.update
            examples:
              all_events:
                summary: Subscribe to all events (default)
                value:
                  url: "https://myapp.example.com/webhooks/whinta"
              specific_events:
                summary: Subscribe to specific events only
                value:
                  url: "https://myapp.example.com/webhooks/whinta"
                  events:
                    - message.received
                    - message.status.update
      responses:
        '201':
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Webhook registered."
                  data:
                    $ref: '#/components/schemas/Webhook'
              example:
                statusCode: 201
                message: "Webhook registered."
                data:
                  uuid: "9fa85f64-5717-4562-b3fc-2c963f66afac"
                  url: "https://myapp.example.com/webhooks/whinta"
                  events:
                    - message.received
                    - message.status.update
                  created_at: "2024-06-06T10:00:00.000Z"
        '403':
          description: Webhooks addon not enabled on the organization's plan
        '422':
          description: Webhook limit (25) exceeded or invalid URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 422
                message: "Maximum of 25 webhooks allowed per organization."

  /api/v1/webhooks/{uuid}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      description: |
        Permanently removes a registered webhook URL. No further events will be
        delivered to that URL after deletion.

        > **Requires the Webhooks addon** to be enabled on the organization's plan.
      security:
        - bearerAuth: [webhooks:write]
      parameters:
        - $ref: '#/components/parameters/XOrgUUID'
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Webhook UUID
      responses:
        '200':
          description: Webhook removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Webhook removed."
        '403':
          description: Webhooks addon not enabled on the organization's plan
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════════════════════════════════════
  # Access Token API  —  Authorization: Bearer <access_token>
  # Token is org-scoped; no X-Organization-UUID header needed.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── AT: Messages ────────────────────────────────────────────────────────────

  /api/send:
    post:
      tags: [AT-Messages]
      operationId: atSendTextMessage
      summary: Send a text message
      description: |
        Send a plain text WhatsApp message to a phone number.

        If `buttons` are included the message becomes an **interactive buttons** message.
        The contact is auto-created if the phone number is not yet in the system.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, message]
              properties:
                phone:
                  type: string
                  description: Recipient phone number with or without leading `+`. Normalized to E.164.
                  example: "+919876543210"
                message:
                  type: string
                  description: Message body text
                  example: "Hello! How can we help you today?"
                header:
                  type: string
                  description: Header text (interactive messages only)
                  example: "Welcome"
                footer:
                  type: string
                  description: Footer text (interactive messages only)
                  example: "Reply anytime"
                buttons:
                  type: array
                  description: Quick-reply buttons. Triggers interactive message type.
                  items:
                    type: object
                first_name:
                  type: string
                  description: First name for auto-created contact
                  example: "Priya"
                last_name:
                  type: string
                  description: Last name for auto-created contact
                  example: "Sharma"
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              plain_text:
                summary: Plain text message
                value:
                  phone: "+919876543210"
                  message: "Hi! Your order has been shipped."
              with_buttons:
                summary: Interactive buttons message
                value:
                  phone: "+919876543210"
                  message: "Please confirm your appointment for tomorrow at 3 PM."
                  header: "Appointment Reminder"
                  footer: "Tap a button to respond"
                  buttons:
                    - type: reply
                      reply:
                        id: confirm
                        title: "✅ Confirm"
                    - type: reply
                      reply:
                        id: cancel
                        title: "❌ Cancel"
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    description: Raw success response from WhatsApp Cloud API
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/send/template:
    post:
      tags: [AT-Messages]
      operationId: atSendTemplateMessage
      summary: Send a template message
      description: |
        Send a pre-approved WhatsApp message template.

        Pass the template `name` and `language` exactly as registered in Meta Business Manager.
        Use `components` to fill in body variables, header media, or dynamic URL button suffixes.
        The `components` array follows the **WhatsApp Cloud API format** directly.

        ---

        ### Body variables

        For templates with `{{1}}`, `{{2}}`, … placeholders in the body:

        ```json
        {
          "type": "body",
          "parameters": [
            { "type": "text", "text": "John Doe" },
            { "type": "text", "text": "ORD-12345" }
          ]
        }
        ```

        Parameters are substituted in order — first item replaces `{{1}}`, second replaces `{{2}}`, etc.

        ---

        ### Header media

        For templates with an IMAGE, VIDEO, or DOCUMENT header:

        ```json
        { "type": "header", "parameters": [{ "type": "image",    "image":    { "link": "https://cdn.example.com/banner.jpg" } }] }
        { "type": "header", "parameters": [{ "type": "video",    "video":    { "link": "https://cdn.example.com/demo.mp4" } }] }
        { "type": "header", "parameters": [{ "type": "document", "document": { "link": "https://cdn.example.com/invoice.pdf", "filename": "Invoice.pdf" } }] }
        ```

        ---

        ### Dynamic URL buttons

        For buttons whose URL contains `{{1}}` (a variable suffix):

        ```json
        {
          "type": "button",
          "sub_type": "url",
          "index": "0",
          "parameters": [{ "type": "text", "text": "ORD-12345" }]
        }
        ```

        `index` is the 0-based position of the button in the template. The `text` value is
        appended to the button's static base URL.

      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, template]
              properties:
                phone:
                  type: string
                  description: Recipient phone number with or without leading `+`. Normalized to E.164.
                  example: "+919876543210"
                template:
                  type: object
                  required: [name, language]
                  properties:
                    name:
                      type: string
                      description: Template name as registered in Meta Business Manager
                      example: "order_confirmation"
                    language:
                      type: object
                      required: [code]
                      description: Language object
                      properties:
                        code:
                          type: string
                          description: BCP-47 language code (e.g. `en`, `en_US`, `hi`)
                          example: "en"
                    components:
                      type: array
                      description: |
                        WhatsApp Cloud API component objects. Each object targets one
                        part of the template: `header`, `body`, or `button`.
                      items:
                        type: object
                        required: [type]
                        properties:
                          type:
                            type: string
                            enum: [header, body, button]
                            description: Component type
                          sub_type:
                            type: string
                            enum: [url]
                            description: Required for `button` components — only `url` is supported for dynamic buttons
                          index:
                            type: string
                            description: Required for `button` components — 0-based button position as a string
                            example: "0"
                          parameters:
                            type: array
                            description: Variable values for this component
                            items:
                              type: object
                              required: [type]
                              properties:
                                type:
                                  type: string
                                  enum: [text, image, video, document]
                                  description: Parameter type
                                text:
                                  type: string
                                  description: Text value — used for `body` variables and dynamic URL button suffixes
                                image:
                                  type: object
                                  description: Image object — used for `header` with IMAGE type
                                  properties:
                                    link:
                                      type: string
                                      format: uri
                                      description: Publicly accessible image URL
                                video:
                                  type: object
                                  description: Video object — used for `header` with VIDEO type
                                  properties:
                                    link:
                                      type: string
                                      format: uri
                                      description: Publicly accessible video URL
                                document:
                                  type: object
                                  description: Document object — used for `header` with DOCUMENT type
                                  properties:
                                    link:
                                      type: string
                                      format: uri
                                      description: Publicly accessible document URL
                                    filename:
                                      type: string
                                      description: Display filename shown in chat
                first_name:
                  type: string
                  description: First name for auto-created contact
                last_name:
                  type: string
                  description: Last name for auto-created contact
                email:
                  type: string
                  format: email
                  description: Email for auto-created contact
            examples:
              body_variables:
                summary: Template with body variables
                value:
                  phone: "+919876543210"
                  template:
                    name: "order_confirmation"
                    language:
                      code: "en"
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: "John Doe"
                          - type: text
                            text: "ORD-12345"
                          - type: text
                            text: "₹499"
              image_header:
                summary: Template with image header
                value:
                  phone: "+919876543210"
                  template:
                    name: "product_launch"
                    language:
                      code: "en"
                    components:
                      - type: header
                        parameters:
                          - type: image
                            image:
                              link: "https://cdn.example.com/product.jpg"
                      - type: body
                        parameters:
                          - type: text
                            text: "Summer Sale 2024"
              document_header:
                summary: Template with document header
                value:
                  phone: "+919876543210"
                  template:
                    name: "invoice_ready"
                    language:
                      code: "en"
                    components:
                      - type: header
                        parameters:
                          - type: document
                            document:
                              link: "https://cdn.example.com/invoice-1234.pdf"
                              filename: "Invoice-1234.pdf"
              dynamic_url_button:
                summary: Template with dynamic URL button
                value:
                  phone: "+919876543210"
                  template:
                    name: "track_order"
                    language:
                      code: "en"
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: "ORD-12345"
                      - type: button
                        sub_type: url
                        index: "0"
                        parameters:
                          - type: text
                            text: "ORD-12345"
      responses:
        '200':
          description: Template message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    description: Raw success response from WhatsApp Cloud API
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/send/media:
    post:
      tags: [AT-Messages]
      operationId: atSendMediaMessage
      summary: Send a media message
      description: Send an image, video, audio, or document via a publicly accessible URL.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, media_type, media_url, caption, file_name]
              properties:
                phone:
                  type: string
                  description: Recipient phone number
                  example: "+919876543210"
                media_type:
                  type: string
