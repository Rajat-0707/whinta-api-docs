      operationId: atCreateContactGroup
      summary: Create a contact group
      description: |
        Creates a new contact group. The `name` must be unique within the organization.

        Returns 403 if the subscription is inactive.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Group name — must be unique within the organization
                  example: "VIP Customers"
            example:
              name: "VIP Customers"
      responses:
        '200':
          description: Contact group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                statusCode: 200
                id: "5fa85f64-5717-4562-b3fc-2c963f66afa8"
