  # ── AT: Automated Replies ─────────────────────────────────────────────────────

  /api/canned-replies:
    get:
      tags: [AT-Automated Replies]
      operationId: atListAutomatedReplies
      summary: List automated replies
      description: Returns a paginated list of all automated reply rules in the organization.
      security:
        - accessToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Results per page (max 100)
      responses:
        '200':
          description: Paginated automated reply list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AutomatedReply'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - uuid: "7fa85f64-5717-4562-b3fc-2c963f66afaa"
                    name: "Greeting reply"
                    trigger: "hello"
                    match_criteria: "contains"
                    metadata:
                      type: "text"
                      data:
                        text: "Hi! Welcome to Whinta. How can I help you?"
                    updated_at: "2024-06-01 10:00:00"
                meta:
                  current_page: 1
                  per_page: 10
                  total: 1
                  last_page: 1
                  from: 1
                  to: 1
                  path: "https://app.whinta.com/api/canned-replies"
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [AT-Automated Replies]
      operationId: atCreateAutomatedReply
      summary: Create an automated reply
      description: |
        Creates a new automated reply rule.

        When an inbound message matches `trigger` (based on `match_criteria`),
        Whinta automatically sends the configured response.

        **Response types:**
        - `text` — pass the reply text in `response`
        - `image` — upload the image file as `response` (multipart/form-data)
        - `audio` — upload the audio file as `response` (multipart/form-data)

        Returns 403 if the subscription is inactive or the automated reply plan limit is reached.
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, match_criteria, response_type, response]
              properties:
                name:
                  type: string
                  description: Internal label for this rule
                  example: "Greeting reply"
                trigger:
                  type: string
                  description: Keyword that triggers the auto reply
                  example: "hello"
                match_criteria:
                  type: string
                  enum: [exact match, contains]
                  description: |
                    - `exact match` — the inbound message must be exactly the trigger
                    - `contains` — the inbound message just needs to contain the trigger
                  example: "contains"
                response_type:
                  type: string
                  enum: [text, image, audio]
                  description: Type of response to send
                  example: "text"
                response:
                  type: string
                  description: |
                    - For `text`: the reply message text
                    - For `image` / `audio`: upload the file via `multipart/form-data`
                  example: "Hi! Welcome to Whinta. How can I help you?"
            example:
              name: "Greeting reply"
              trigger: "hello"
              match_criteria: "contains"
              response_type: "text"
              response: "Hi! Welcome to Whinta. How can I help you today?"
      responses:
        '200':
          description: Automated reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                statusCode: 200
                id: "7fa85f64-5717-4562-b3fc-2c963f66afaa"
                message: "Request processed successfully"
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/canned-replies/{uuid}:
    put:
      tags: [AT-Automated Replies]
      operationId: atUpdateAutomatedReply
      summary: Update an automated reply
      security:
        - accessToken: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Automated reply UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, match_criteria, response_type, response]
              properties:
                name:
                  type: string
                  example: "Greeting reply updated"
                trigger:
                  type: string
                  example: "hi"
                match_criteria:
                  type: string
                  enum: [exact match, contains]
                  example: "contains"
                response_type:
                  type: string
                  enum: [text, image, audio]
                  example: "text"
                response:
                  type: string
                  description: Reply text (for text type) or file upload (for image/audio)
                  example: "Hello! How may I assist you?"
      responses:
        '200':
          description: Automated reply updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/SubscriptionError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [AT-Automated Replies]
      operationId: atDeleteAutomatedReply
      summary: Delete an automated reply
      description: Soft-deletes the automated reply rule. It will no longer fire for incoming messages.
      security:
        - accessToken: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Automated reply UUID
      responses:
        '200':
          description: Automated reply deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                statusCode: 200
                id: "7fa85f64-5717-4562-b3fc-2c963f66afaa"
                message: "Request processed successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

